<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media library</title>
    <link rel="stylesheet" href="/upload/styles.css">
</head>
<body>
    <main>
        <h1>Media library</h1>

        <section aria-labelledby="upload-heading">
            <h2 id="upload-heading">Upload</h2>
            <form id="upload-form" enctype="multipart/form-data">
                <label class="visually-hidden" for="file">Choose files to upload</label>
                <input
                    id="file"
                    name="file"
                    type="file"
                    accept="image/jpeg,image/png,application/pdf"
                    multiple
                    required
                    aria-describedby="status"
                >
                <button type="submit">Upload</button>
            </form>
            <output id="status" aria-live="polite"></output>
        </section>

        <section aria-labelledby="library-heading">
            <h2 id="library-heading">Browse</h2>
            <form id="filter-form">
                <input
                    id="search"
                    name="search"
                    type="search"
                    placeholder="Search titles…"
                    aria-label="Search titles"
                >
                <select id="category" name="category" aria-label="Filter by category">
                    <option value="">All categories</option>
                    <option value="image">Image</option>
                    <option value="document">Document</option>
                    <option value="other">Other</option>
                </select>
                <button type="submit">Apply</button>
            </form>

            <output id="list-status" aria-live="polite"></output>
            <ul id="media-list"></ul>

            <nav id="pager" aria-label="Pagination" hidden>
                <button type="button" id="prev">‹ Prev</button>
                <span id="page-info"></span>
                <button type="button" id="next">Next ›</button>
            </nav>
        </section>
    </main>
    <script src="/upload/upload.js" defer></script>
</body>
</html>
